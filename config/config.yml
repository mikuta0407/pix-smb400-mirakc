# /data/local/tmp/mirakc/config.yml
#
# Verified on the real PIX-SMB400 on 2026-08-04.
# Ported from the device's Mirakurun config
# (/data/local/tmp/mirakurun/config/{server,tuners,channels}.yml).  Most BS
# channels were `isDisabled: true` there; they were added back on 2026-10-26
# after confirming they receive and descramble.
#
# Mirakurun declares one entry per service on the same physical channel;
# mirakc merges them into a single channel entry with `services: [...]`.

epg:
  cache-dir: /data/local/tmp/mirakc/epg

server:
  addrs:
    - http: '0.0.0.0:40772'
  # Measured time-to-first-byte for BS4K on this device is ~4.0s (satellite lock
  # ~2.4s + dantto4k filling its 5MB chunk ~1.2s), so the 16000ms default would
  # already be enough.  Kept at 30000 as a margin.  Note this is global, so
  # GR/BS anomaly detection gets equally sluggish.  Minimum accepted is 15000.
  stream-time-limit: 30000

channels:
  # --- BS4K (ISDB-S3) ---
  # `channel` is the TLV stream id; smb400-tuner.sh maps it to an IF frequency.
  # BS8K (45280) is deliberately absent: smb400-tuner.sh has no IF frequency for
  # it and exits with "unknown BS4K channel".
  - name: BS4K 45328
    type: BS4K
    channel: '45328'

  # --- BS (ISDB-S, 2K) ---
  # Free-to-air transponders only.  `channel` must be one smb400-tuner.sh has a
  # TS-ID for.  `services` is left out so the list follows whatever scan-services
  # finds, since BS services get reshuffled from time to time.
  # Pay channels (BS03_0 / BS05_0 / BS19_0 / BS21_0 / BS23_0) are omitted: they
  # cannot be descrambled without a subscription.  Same as the Mirakurun config.
  - name: BS朝日
    type: BS
    channel: BS01_0
  - name: BS-TBS
    type: BS
    channel: BS01_1
  - name: BSテレ東
    type: BS
    channel: BS01_2
  - name: BS11イレブン
    type: BS
    channel: BS09_0
  - name: BS12トゥエルビ
    type: BS
    channel: BS09_2
  - name: BS日テレ
    type: BS
    channel: BS13_0
  - name: BSフジ
    type: BS
    channel: BS13_1
  - name: 放送大学
    type: BS
    channel: BS13_2
  - name: NHK BS
    type: BS
    channel: BS15_0
  - name: BS10
    type: BS
    channel: BS15_2
  - name: BSよしもと
    type: BS
    channel: BS23_1
  - name: J:COM BS
    type: BS
    channel: BS23_3

  # --- GR (ISDB-T) ---
  - name: NHK総合
    type: GR
    channel: '27'
  - name: NHK Eテレ
    type: GR
    channel: '26'
  - name: 日テレ
    type: GR
    channel: '25'
  - name: テレビ朝日
    type: GR
    channel: '24'
  - name: TBS
    type: GR
    channel: '22'
  - name: テレビ東京
    type: GR
    channel: '23'
  - name: フジテレビ
    type: GR
    channel: '21'

tuners:
  # There is exactly one physical tuner.
  - name: SMB400
    types: [GR, BS, BS4K]
    command: /data/local/tmp/smb400-tuner.sh {{{channel}}}
    # b21dec / b61dec already descramble inside smb400-tuner.sh, so no
    # decode-filter is needed.  Same intent as Mirakurun's `tlvDecoder: null`.
    decoded: true
    time-limit: 30000

filters:
  # BS4K only: remux MMT/TLV to MPEG-TS.  tuner-filter is applied when the tuner
  # starts, so both streaming and background jobs see remuxed TS — verified:
  # scan-services, sync-clocks and update-schedules all succeed on BS4K.
  for-channel-types:
    BS4K:
      tuner-filter:
        # --frontend-descrambled is mandatory: this build has the ACAS/AES-NI
        # path stubbed out and throws if asked to descramble.
        command: /data/local/tmp/dantto4k - - --frontend-descrambled

jobs:
  # Only one tuner exists, so jobs must not overlap with each other or with
  # viewing: a web viewer preempts a running job (priority 0 vs -1) and the job
  # then fails with "deadline has elapsed".  Measured durations with the channel
  # list above (2026-10-26):
  #   scan-services    ~3m    (BS ~5-18s each, GR ~4s each)
  #   sync-clocks      ~2m15s
  #   update-schedules ~45m   (BS ~3m each, GR and BS4K ~1m each)
  # update-schedules' timeout applies to each channel, not to the whole job.
  # Note: mirakc also runs every one of these once at startup, regardless of
  # schedule.  Staggered 10 minutes apart in the early morning.
  scan-services:
    schedule: '0 1 5 * * * *'
  sync-clocks:
    schedule: '0 11 5 * * * *'
  update-schedules:
    schedule: '0 21 5 * * * *'
    timeout: 20m

resource:
  strings-yaml: /data/local/tmp/mirakc/strings.yml
